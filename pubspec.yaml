name: akshaya
description: Akshaya, a grocery and pantry manager.
publish_to: none
version: 0.0.1+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Variable.ttf
