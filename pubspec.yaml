name: akshaya
description: Akshaya Patra, a grocery and pantry manager.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  drift: ^2.35.0
  drift_flutter: ^0.3.0
  uuid: ^4.5.0
  share_plus: ^13.3.1
  http: ^1.2.0
  mobile_scanner: ^7.5.0
  flutter_local_notifications: ^22.3.3
  # flutter_local_notifications 22.x uses timezone 0.10.x.
  timezone: ">=0.10.1 <0.12.0"
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Variable.ttf
