name: akshaya
description: Akshaya Patra, a grocery and pantry manager.
publish_to: none
version: 1.0.2+3

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  dynamic_color: ^1.7.0
  flutter_riverpod: ^3.0.0
  drift: ^2.35.0
  drift_flutter: ^0.3.0
  uuid: ^4.5.0
  share_plus: ^13.3.1
  http: ^1.2.0
  mobile_scanner: ^7.5.0
  flutter_local_notifications: ^22.3.3
  # flutter_local_notifications 22.x uses timezone 0.10.x.
  timezone: ">=0.10.1 <0.12.0"
  workmanager: ^0.10.10
  home_widget: ">=0.8.0 <1.0.0"
  quick_actions: ^1.1.0
  # Phase 5: AI through Firebase AI Logic (Gemini Developer API, Spark plan),
  # App Check and Remote Config. Lower bounds only; pin after the first
  # successful CI build (see PROGRESS.md).
  firebase_core: ^4.0.0
  firebase_ai: ^3.0.0
  firebase_app_check: ^0.4.0
  firebase_remote_config: ^6.0.0
  # Phase 6: optional sign-in and household sync (Spark plan, no server code).
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  # Shows the household invite code as a QR code (scanning reuses
  # mobile_scanner).
  qr_flutter: ^4.1.0
  # Phase 8: charts, biometric app lock, backup files through the Android file dialog.
  animations: ^2.0.11
  fl_chart: ^1.3.0
  local_auth: ^3.0.1
  file_picker: ^13.1.0
  # Voice: the phone's recogniser, plus a recorder for the Gemini fallback.
  speech_to_text: ^7.0.0
  record: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
  assets:
    - assets/dictionary/
    - assets/prompts/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Variable.ttf
