name: Android debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    # Creates the android/ platform folder once (applicationId
    # com.akshayapatra.app) and commits it back. It only runs when android/ is
    # missing: permissions, icons and the label are committed in android/ and
    # live there from then on.
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.check.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -d android ]; then echo "created=false" >> "$GITHUB_OUTPUT"; else echo "created=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.created == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: steps.check.outputs.created == 'true'
        run: |
          flutter create --platforms=android --org com.akshaya --project-name akshaya .
          # Pin the application id and label.
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i 's/applicationId = "[^"]*"/applicationId = "com.akshayapatra.app"/; s/applicationId "[^"]*"/applicationId "com.akshayapatra.app"/' "$f"
          done
          sed -i 's/android:label="[^"]*"/android:label="Akshaya Patra"/' android/app/src/main/AndroidManifest.xml
          git checkout -- lib pubspec.yaml test 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "ci: bootstrap android platform (com.akshayapatra.app)"
          # GitHub occasionally answers pushes with a transient 500; retry.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed (attempt $attempt), retrying..."
            sleep $((attempt * 10))
            git pull --rebase || true
          done
          exit 1

  verify:
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: Commit pubspec.lock when dependencies change (freezes versions)
        run: |
          if [ -f pubspec.lock ] && [ -n "$(git status --porcelain pubspec.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.lock
            git commit -m "ci: update pubspec.lock to freeze dependency versions"
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              sleep $((attempt * 10))
              git pull --rebase || true
            done
          fi
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  build-apk:
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Pull bootstrap commit
        if: needs.bootstrap.outputs.created == 'true'
        run: git pull --rebase origin "${GITHUB_REF_NAME}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Firebase settings from the GOOGLE_SERVICES_JSON secret (if set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # The app reads its Firebase settings from --dart-define values (no
          # google-services Gradle plugin, nothing committed). Without the
          # secret the app still builds; AI then stays in offline mode.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/gs.json"
            PKG=com.akshayapatra.app
            API_KEY=$(jq -r --arg p "$PKG" '[.client[] | select(.client_info.android_client_info.package_name==$p)][0].api_key[0].current_key // empty' "$RUNNER_TEMP/gs.json")
            APP_ID=$(jq -r --arg p "$PKG" '[.client[] | select(.client_info.android_client_info.package_name==$p)][0].client_info.mobilesdk_app_id // empty' "$RUNNER_TEMP/gs.json")
            WEB_CLIENT_ID=$(jq -r '[.client[].oauth_client[]? | select(.client_type==3)][0].client_id // empty' "$RUNNER_TEMP/gs.json")
            PROJECT_ID=$(jq -r '.project_info.project_id // empty' "$RUNNER_TEMP/gs.json")
            SENDER_ID=$(jq -r '.project_info.project_number // empty' "$RUNNER_TEMP/gs.json")
            rm -f "$RUNNER_TEMP/gs.json"
            if [ -z "$API_KEY" ] || [ -z "$APP_ID" ] || [ -z "$PROJECT_ID" ] || [ -z "$SENDER_ID" ]; then
              echo "::warning::GOOGLE_SERVICES_JSON has no Android app for $PKG; building without Firebase."
            else
              echo "::add-mask::$API_KEY"
              echo "::add-mask::$APP_ID"
              DEFINES="--dart-define=FIREBASE_API_KEY=$API_KEY --dart-define=FIREBASE_APP_ID=$APP_ID --dart-define=FIREBASE_PROJECT_ID=$PROJECT_ID --dart-define=FIREBASE_SENDER_ID=$SENDER_ID"
              if [ -n "$WEB_CLIENT_ID" ]; then
                echo "::add-mask::$WEB_CLIENT_ID"
                DEFINES="$DEFINES --dart-define=FIREBASE_WEB_CLIENT_ID=$WEB_CLIENT_ID"
              else
                echo "::warning::No web OAuth client in GOOGLE_SERVICES_JSON: Google sign-in needs the Google provider enabled and the SHA-1 registered, then a fresh google-services.json."
              fi
              echo "DART_DEFINES=$DEFINES" >> "$GITHUB_ENV"
            fi
          else
            echo "No GOOGLE_SERVICES_JSON secret; building without Firebase (AI stays offline)."
          fi
      - name: Restore DEBUG_KEYSTORE_BASE64 (if set)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using the keystore from the DEBUG_KEYSTORE_BASE64 secret."
          fi
      - name: Cache a generated debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: akshaya-debug-keystore-v1
      - name: Create the debug keystore once and print its SHA-1
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Register this SHA-1 in Firebase (Project settings > Your apps) for Google sign-in:"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"
      - name: Build debug APK
        run: flutter build apk --debug $DART_DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: akshaya-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  rules-tests:
    # Firestore security rules, run against the local emulator (no Firebase
    # project, no billing).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install -g firebase-tools@13.29.1
      - run: npm install
        working-directory: firebase
      - run: firebase emulators:exec --only firestore --project akshaya-rules-test "npm test"
        working-directory: firebase
